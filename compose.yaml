services:
  bot:
    build:
      context: .
    init: true
    restart: unless-stopped
    env_file:
      - .env
    environment:
      BOT_DATA_DIR: /data
    volumes:
      - bot-data:/data
    stop_grace_period: 45s
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request; urllib.request.urlopen('http://127.0.0.1:10001/readyz', timeout=3)"
      interval: 30s
      timeout: 5s
      start_period: 20s
      retries: 3

volumes:
  bot-data:
