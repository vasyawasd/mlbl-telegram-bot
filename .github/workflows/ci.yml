name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
          cache: pip
      - name: Install dependencies
        run: python -m pip install --upgrade pip && python -m pip install -r requirements.txt
      - name: Compile Python sources
        run: python -m py_compile main.py supervisor.py test_bot.py test_supervisor.py
      - name: Run unit tests
        env:
          BOT_TOKEN: ci-placeholder-token
        run: python -m unittest -v
      - name: Build container image
        run: docker build --tag mlbl-telegram-bot:ci .
